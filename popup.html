<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>TimeTrack</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="pp-header">
    <div class="pp-brand"><img class="brand-logo" src="icons/icon.svg" alt="" aria-hidden="true">TimeTrack</div>
    <div class="pp-header-right">
      <div class="pp-date" id="dateLabel"></div>
      <button type="button" class="icon-gear" id="openSettings" aria-label="Settings" data-i18n-aria-label="ariaSettings">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="pp-main">
    <section class="pp-hero">
      <div class="pp-total" id="totalTime">–</div>
      <div class="pp-hero-label" data-i18n="activeBrowsing">active browsing</div>
      <div class="pp-delta" id="delta"></div>
      <div class="pp-current" id="currentSite"></div>
    </section>

    <section class="pp-top" id="topSection">
      <div class="pp-section-title" data-i18n="topWebsites">Top websites</div>
      <div id="siteList"></div>
    </section>

    <section class="pp-empty" id="emptyState" hidden>
      <svg class="pp-empty-icon" viewBox="0 0 24 24" width="40" height="40" aria-hidden="true">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <div class="pp-empty-title" data-i18n="emptyTitle">No browsing activity yet</div>
      <p data-i18n="emptyBody">Start browsing and TimeTrack will show where your time goes.</p>
    </section>

    <section class="pp-error" id="errorState" hidden>
      <span data-i18n="loadError">Unable to load stats. Close and reopen the popup to try again.</span>
    </section>

    <button type="button" class="pp-open" id="openDashboard" data-i18n="openDashboard">View detailed analytics</button>
  </main>

  <footer class="pp-footer" data-i18n="localFooter">Stored locally on this device · never uploaded</footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
