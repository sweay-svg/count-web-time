<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>TimeTrack</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="pp-header">
    <div class="pp-brand">TimeTrack</div>
    <div class="pp-date" id="dateLabel"></div>
  </header>

  <main class="pp-main">
    <section class="pp-hero">
      <div class="pp-total" id="totalTime">–</div>
      <div class="pp-hero-label">__MSG_activeBrowsing__</div>
      <div class="pp-delta" id="delta"></div>
      <div class="pp-current" id="currentSite"></div>
    </section>

    <section class="pp-top" id="topSection">
      <div class="pp-section-title">__MSG_topWebsites__</div>
      <div id="siteList"></div>
    </section>

    <section class="pp-empty" id="emptyState" hidden>
      <svg class="pp-empty-icon" viewBox="0 0 24 24" width="40" height="40" aria-hidden="true">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <div class="pp-empty-title">__MSG_emptyTitle__</div>
      <p>__MSG_emptyBody__</p>
    </section>

    <section class="pp-error" id="errorState" hidden>
      __MSG_loadError__
    </section>

    <button type="button" class="pp-open" id="openDashboard">__MSG_openDashboard__</button>
  </main>

  <footer class="pp-footer">__MSG_localFooter__</footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
